[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inktrace"
version = "0.1.0"
description = "Leak tracing with invisible text watermarks"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Arham Basit" },
  { name = "Muhammad Hassaan Moazan" },
  { name = "Yasir Zafar" },
]
dependencies = ["flask>=3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.6"]

[project.scripts]
inktrace = "inktrace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["inktrace"]
branch = true
